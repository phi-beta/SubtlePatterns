[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subtle-patterns"
version = "0.1.0"
description = "Production-grade library for rendering subtle, mostly-transparent SVG overlay patterns for website backgrounds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Philippe R. Beauchamp", email = "prb@noetroniq.com" },
]
keywords = ["svg", "patterns", "backgrounds", "overlays", "design", "web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
lxml = ["lxml>=5.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pyyaml>=6.0",
]
preview = [
  "lxml>=5.0",
]

[project.scripts]
subtle-patterns = "subtle_patterns.cli.main:cli"

[project.urls]
Homepage = "https://github.com/PhilippeRBeauchamp/SubtlePatterns"
Issues = "https://github.com/PhilippeRBeauchamp/SubtlePatterns/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/subtle_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["subtle_patterns"]
branch = true
